<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 280" width="100%" height="280">
  <style>
    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #00F5FF;
      letter-spacing: 1.5px;
    }
    .value {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #ffffff;
    }
    .subtext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #94A3B8;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 10px; opacity: 0; }
    }
    .pulsing-ring {
      animation: pulse 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
  </style>

  <defs>
    <filter id="blur-bg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="20" />

  <!-- Ambient Glow -->
  <g filter="url(#blur-bg)">
    <circle cx="190" cy="140" r="100" fill="url(#glow-grad)" />
  </g>

  <!-- Card Body -->
  <rect x="20" y="20" width="345" height="240" rx="20" fill="url(#plate-grad)" stroke="url(#border-grad)" stroke-width="1.5" filter="url(#shadow)" />
  <path d="M 21 40 C 21 30, 30 21, 40 21 L 345 21" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Widget Header -->
  <g transform="translate(40, 48)">
    <text x="0" y="0" class="label">SYSTEM STATUS</text>
    
    <!-- Pulse Indicator -->
    <circle cx="280" cy="-4" r="5" fill="#10B981" />
    <circle cx="280" cy="-4" r="5" fill="none" stroke="#10B981" stroke-width="1.5" class="pulsing-ring" />
    <text x="290" y="0" class="value" font-size="11" fill="#10B981">ONLINE</text>
  </g>

  <!-- Items list -->
  
  <!-- Item 1: Organization -->
  <g transform="translate(40, 85)">
    <!-- Building Icon -->
    <path d="M 0 24 L 20 24 M 3 24 L 3 6 L 17 6 L 17 24 M 7 10 L 13 10 M 7 15 L 13 15 M 10 20 L 10 24" stroke="#06B6D4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="translate(32, 10)">
      <text x="0" y="0" class="label" fill="#64748B">ORGANIZATION</text>
      <text x="0" y="16" class="value">Eritheia Labs</text>
    </g>
  </g>

  <!-- Item 2: Location -->
  <g transform="translate(40, 142)">
    <!-- Location Pin Icon -->
    <path d="M 10 2 A 6 6 0 0 0 4 8 C 4 13.5 10 20 10 20 C 10 20 16 13.5 16 8 A 6 6 0 0 0 10 2 Z M 10 10 A 2 2 0 1 1 10.001 9.999 Z" stroke="#3B82F6" stroke-width="1.5" fill="none" stroke-linejoin="round" />
    <g transform="translate(32, 10)">
      <text x="0" y="0" class="label" fill="#64748B">LOCATION</text>
      <text x="0" y="16" class="value">Lahore, Pakistan</text>
      <text x="0" y="30" class="subtext">UTC +05:00</text>
    </g>
  </g>

  <!-- Item 3: Current Focus -->
  <g transform="translate(40, 208)">
    <!-- Target / Focus Icon -->
    <circle cx="10" cy="10" r="8" stroke="#10B981" stroke-width="1.5" fill="none" />
    <circle cx="10" cy="10" r="4" fill="#10B981" />
    <g transform="translate(32, 10)">
      <text x="0" y="0" class="label" fill="#64748B">CURRENT FOCUS</text>
      <text x="0" y="16" class="value" fill="#00F5FF">Next-Gen MERN &amp; DevOps</text>
    </g>
  </g>

</svg>
