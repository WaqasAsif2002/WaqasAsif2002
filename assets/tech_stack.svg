<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" height="330">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 16px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    .sec-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #94A3B8;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #ffffff;
    }
    .badge-rect {
      fill: rgba(255, 255, 255, 0.04);
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1px;
    }
    .badge-cyan {
      stroke: rgba(6, 182, 212, 0.4);
      fill: rgba(6, 182, 212, 0.06);
    }
    .badge-blue {
      stroke: rgba(59, 130, 246, 0.4);
      fill: rgba(59, 130, 246, 0.06);
    }
    .badge-purple {
      stroke: rgba(168, 85, 247, 0.4);
      fill: rgba(168, 85, 247, 0.06);
    }
    .badge-green {
      stroke: rgba(16, 185, 129, 0.4);
      fill: rgba(16, 185, 129, 0.06);
    }
  </style>

  <defs>
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="20" />

  <!-- Ambient Glows -->
  <g filter="url(#blur-bg)">
    <circle cx="150" cy="160" r="110" fill="url(#glow-cyan)" />
    <circle cx="590" cy="160" r="110" fill="url(#glow-purple)" />
  </g>

  <!-- Frosted Glass Main Plate -->
  <rect x="20" y="20" width="700" height="290" rx="20" fill="url(#plate-grad)" stroke="url(#border-grad)" stroke-width="1.5" filter="url(#shadow)" />
  <path d="M 21 40 C 21 30, 30 21, 40 21 L 700 21" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Header -->
  <g transform="translate(40, 52)">
    <text x="0" y="0" class="title">WEAPONS OF CHOICE</text>
    <rect x="0" y="8" width="60" height="2" rx="1" fill="#06B6D4" />
  </g>

  <!-- 4 Grid Sections -->

  <!-- ================= FRONTEND ================= -->
  <g transform="translate(40, 85)">
    <text x="0" y="12" class="sec-title">FRONTEND ARCHITECTURE</text>
    
    <!-- React.js -->
    <rect x="0" y="25" width="85" height="26" rx="6" class="badge-rect badge-cyan" />
    <text x="14" y="42" class="badge-text" fill="#22D3EE">React.js</text>
    
    <!-- Next.js -->
    <rect x="95" y="25" width="80" height="26" rx="6" class="badge-rect badge-cyan" />
    <text x="110" y="42" class="badge-text" fill="#22D3EE">Next.js</text>

    <!-- TypeScript -->
    <rect x="185" y="25" width="95" height="26" rx="6" class="badge-rect badge-cyan" />
    <text x="198" y="42" class="badge-text" fill="#22D3EE">TypeScript</text>

    <!-- Tailwind CSS -->
    <rect x="0" y="60" width="105" height="26" rx="6" class="badge-rect badge-cyan" />
    <text x="12" y="77" class="badge-text" fill="#22D3EE">Tailwind CSS</text>

    <!-- Redux -->
    <rect x="115" y="60" width="75" height="26" rx="6" class="badge-rect badge-cyan" />
    <text x="26" y="77" class="badge-text" fill="#22D3EE">Redux</text>

    <!-- HTML5 / CSS3 -->
    <rect x="200" y="60" width="80" height="26" rx="6" class="badge-rect badge-cyan" />
    <text x="12" y="77" class="badge-text" fill="#22D3EE" transform="translate(200, 0)">HTML/CSS</text>
  </g>

  <!-- ================= BACKEND / DATABASE ================= -->
  <g transform="translate(380, 85)">
    <text x="0" y="12" class="sec-title">BACKEND &amp; DATABASE</text>

    <!-- Node.js -->
    <rect x="0" y="25" width="80" height="26" rx="6" class="badge-rect badge-green" />
    <text x="17" y="42" class="badge-text" fill="#34D399">Node.js</text>

    <!-- Express.js -->
    <rect x="90" y="25" width="90" height="26" rx="6" class="badge-rect badge-green" />
    <text x="16" y="42" class="badge-text" fill="#34D399">Express.js</text>

    <!-- MongoDB -->
    <rect x="190" y="25" width="90" height="26" rx="6" class="badge-rect badge-green" />
    <text x="19" y="42" class="badge-text" fill="#34D399">MongoDB</text>

    <!-- PostgreSQL -->
    <rect x="0" y="60" width="100" height="26" rx="6" class="badge-rect badge-green" />
    <text x="16" y="77" class="badge-text" fill="#34D399">PostgreSQL</text>

    <!-- Firebase -->
    <rect x="110" y="60" width="80" height="26" rx="6" class="badge-rect badge-green" />
    <text x="20" y="77" class="badge-text" fill="#34D399">Firebase</text>

    <!-- MySQL -->
    <rect x="200" y="60" width="80" height="26" rx="6" class="badge-rect badge-green" />
    <text x="24" y="77" class="badge-text" fill="#34D399">MySQL</text>
  </g>

  <!-- ================= LANGUAGES ================= -->
  <g transform="translate(40, 200)">
    <text x="0" y="12" class="sec-title">PROGRAMMING LANGUAGES</text>

    <!-- JavaScript -->
    <rect x="0" y="25" width="95" height="26" rx="6" class="badge-rect badge-blue" />
    <text x="14" y="42" class="badge-text" fill="#60A5FA">JavaScript</text>

    <!-- C++ -->
    <rect x="105" y="25" width="60" height="26" rx="6" class="badge-rect badge-blue" />
    <text x="20" y="42" class="badge-text" fill="#60A5FA">C++</text>

    <!-- Java -->
    <rect x="175" y="25" width="65" height="26" rx="6" class="badge-rect badge-blue" />
    <text x="19" y="42" class="badge-text" fill="#60A5FA">Java</text>

    <!-- PHP -->
    <rect x="250" y="25" width="55" height="26" rx="6" class="badge-rect badge-blue" />
    <text x="17" y="42" class="badge-text" fill="#60A5FA">PHP</text>
  </g>

  <!-- ================= PLATFORMS & TOOLS ================= -->
  <g transform="translate(380, 200)">
    <text x="0" y="12" class="sec-title">DEV PLATFORMS &amp; TOOLS</text>

    <!-- Git & GitHub -->
    <rect x="0" y="25" width="105" height="26" rx="6" class="badge-rect badge-purple" />
    <text x="14" y="42" class="badge-text" fill="#C084FC">Git &amp; GitHub</text>

    <!-- Docker -->
    <rect x="115" y="25" width="75" height="26" rx="6" class="badge-rect badge-purple" />
    <text x="18" y="42" class="badge-text" fill="#C084FC">Docker</text>

    <!-- VS Code -->
    <rect x="200" y="25" width="80" height="26" rx="6" class="badge-rect badge-purple" />
    <text x="15" y="42" class="badge-text" fill="#C084FC">VS Code</text>

    <!-- Postman -->
    <rect x="0" y="60" width="80" height="26" rx="6" class="badge-rect badge-purple" />
    <text x="15" y="77" class="badge-text" fill="#C084FC">Postman</text>

    <!-- Figma -->
    <rect x="90" y="60" width="70" height="26" rx="6" class="badge-rect badge-purple" />
    <text x="17" y="77" class="badge-text" fill="#C084FC">Figma</text>

    <!-- Vercel / Netlify -->
    <rect x="170" y="60" width="110" height="26" rx="6" class="badge-rect badge-purple" />
    <text x="13" y="77" class="badge-text" fill="#C084FC">Vercel &amp; Netlify</text>
  </g>

</svg>
