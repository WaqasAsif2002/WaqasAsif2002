<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <style>
    .panel-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #00F5FF;
      letter-spacing: 2px;
    }
    .panel-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748B;
      letter-spacing: 0.5px;
    }
    .panel-value {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #ffffff;
    }
    .skill-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #E2E8F0;
    }
    .skill-percent {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #00F5FF;
    }
    @keyframes pulse-ring {
      0% { r: 3px; opacity: 1; }
      100% { r: 8px; opacity: 0; }
    }
    .active-dot {
      animation: pulse-ring 2s ease-out infinite;
    }
  </style>

  <defs>
    <!-- Background Blur filter -->
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="55" result="blur" />
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#020617" flood-opacity="0.6"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="20" />

  <!-- Ambient Glow Effects -->
  <g filter="url(#blur-bg)">
    <circle cx="150" cy="150" r="100" fill="url(#glow-cyan)" />
    <circle cx="650" cy="150" r="100" fill="url(#glow-purple)" />
  </g>

  <!-- Main Dashboard Outer Frame -->
  <rect x="15" y="15" width="770" height="270" rx="20" fill="url(#plate-grad)" stroke="url(#border-grad)" stroke-width="1.5" filter="url(#shadow)" />
  <path d="M 16 35 C 16 25, 25 16, 35 16 L 765 16" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2" />

  <!-- ================= LEFT COLUMN: SYSTEM INFO ================= -->
  
  <!-- Sub-Panel 1: Mission Diagnostics (Glass inset rect) -->
  <rect x="35" y="35" width="350" height="105" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  
  <g transform="translate(50, 48)">
    <text x="0" y="12" class="panel-title">MISSION_DIAGNOSTICS</text>
    
    <!-- Pulse Light -->
    <circle cx="310" cy="8" r="4" fill="#00FF41" />
    <circle cx="310" cy="8" r="4" fill="none" stroke="#00FF41" stroke-width="1.5" class="active-dot" />
    
    <g transform="translate(0, 32)">
      <text x="0" y="0" class="panel-label">ORGANIZATION</text>
      <text x="0" y="16" class="panel-value">Eritheia Labs</text>
    </g>
    
    <g transform="translate(180, 32)">
      <text x="0" y="0" class="panel-label">LOCATION</text>
      <text x="0" y="16" class="panel-value">Lahore, Pakistan</text>
    </g>
  </g>

  <!-- Sub-Panel 2: Pulse Metrics (Glass inset rect) -->
  <rect x="35" y="160" width="350" height="105" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  
  <g transform="translate(50, 172)">
    <text x="0" y="12" class="panel-title">BIOMETRIC_PULSE</text>
    
    <g transform="translate(0, 32)">
      <text x="0" y="0" class="panel-label">COFFEE LOAD</text>
      <text x="0" y="16" class="panel-value" fill="#34D399">96% Capacity</text>
    </g>
    
    <g transform="translate(180, 32)">
      <text x="0" y="0" class="panel-label">LINK STATUS</text>
      <text x="0" y="16" class="panel-value" fill="#00F5FF">Omega-Clearance</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: NEURAL SKILLS ================= -->
  
  <!-- Right Panel Base (Glass inset rect) -->
  <rect x="415" y="35" width="350" height="230" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  
  <g transform="translate(435, 48)">
    <text x="0" y="12" class="panel-title">NEURAL_CAPABILITIES</text>
    
    <!-- Skill 1: Frontend -->
    <g transform="translate(0, 32)">
      <text x="0" y="12" class="skill-name">Frontend Cortex (React, Next.js, TS)</text>
      <text x="310" y="12" class="skill-percent" text-anchor="end">94%</text>
      <rect x="0" y="20" width="310" height="6" rx="3" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="0" y="20" width="291" height="6" rx="3" fill="url(#bar-grad)" />
    </g>

    <!-- Skill 2: Backend -->
    <g transform="translate(0, 74)">
      <text x="0" y="12" class="skill-name">Backend Core (Node, Express, APIs)</text>
      <text x="310" y="12" class="skill-percent" text-anchor="end">90%</text>
      <rect x="0" y="20" width="310" height="6" rx="3" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="0" y="20" width="279" height="6" rx="3" fill="url(#bar-grad)" />
    </g>

    <!-- Skill 3: DB & Storage -->
    <g transform="translate(0, 116)">
      <text x="0" y="12" class="skill-name">Database Core (MongoDB, SQL)</text>
      <text x="310" y="12" class="skill-percent" text-anchor="end">82%</text>
      <rect x="0" y="20" width="310" height="6" rx="3" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="0" y="20" width="254" height="6" rx="3" fill="url(#bar-grad)" />
    </g>

    <!-- Skill 4: Cloud & Ops -->
    <g transform="translate(0, 158)">
      <text x="0" y="12" class="skill-name">Cloud Optics &amp; DevOps (Docker, Git)</text>
      <text x="310" y="12" class="skill-percent" text-anchor="end">85%</text>
      <rect x="0" y="20" width="310" height="6" rx="3" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="0" y="20" width="263" height="6" rx="3" fill="url(#bar-grad)" />
    </g>
  </g>

</svg>
