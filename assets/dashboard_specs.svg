<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="100%">
  <defs>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base canvas -->
  <rect width="100%" height="100%" fill="#000000"/>

  <!-- Volumetric glow -->
  <g filter="url(#subtle-glow)">
    <ellipse cx="420" cy="140" rx="200" ry="80" fill="url(#glow-purple)"/>
  </g>

  <!-- Structural Grid Lines -->
  <line x1="70" y1="0" x2="70" y2="280" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5"/>
  <line x1="770" y1="0" x2="770" y2="280" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5"/>
  <line x1="300" y1="40" x2="300" y2="240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
  <line x1="560" y1="40" x2="560" y2="240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- Main Inset Card -->
  <rect x="70" y="30" width="700" height="220" rx="16" fill="url(#plate-grad)" stroke="url(#border-grad)" stroke-width="1"/>

  <!-- Sub-Panel 1: Core Pillars -->
  <g transform="translate(100, 60)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#525252" letter-spacing="2" font-weight="700">01 // FOCUS</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#FFFFFF" font-weight="600" letter-spacing="-0.5">Architecture</text>
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#71717A" line-height="1.5">
      <tspan x="0" dy="0">Designing highly performant</tspan>
      <tspan x="0" dy="18">web systems. Creating clean,</tspan>
      <tspan x="0" dy="18">maintainable code structures</tspan>
      <tspan x="0" dy="18">with end-to-end type safety.</tspan>
    </text>
  </g>

  <!-- Sub-Panel 2: Tech Matrix -->
  <g transform="translate(330, 60)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#525252" letter-spacing="2" font-weight="700">02 // TECH MATRIX</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#FFFFFF" font-weight="600" letter-spacing="-0.5">Stack &amp; Tools</text>
    
    <!-- Skills categories with clean layout -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="500">Frontend</text>
    <text x="75" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#71717A">Next.js • React • TS • Tailwind</text>

    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="500">Backend</text>
    <text x="75" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#71717A">Node.js • Express • PostgreSQL</text>

    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="500">Cloud/DB</text>
    <text x="75" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#71717A">MongoDB • Docker • Vercel</text>
  </g>

  <!-- Sub-Panel 3: Affiliation -->
  <g transform="translate(590, 60)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#525252" letter-spacing="2" font-weight="700">03 // STATUS</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#FFFFFF" font-weight="600" letter-spacing="-0.5">Affiliation</text>
    
    <!-- Pulsing active indicator -->
    <circle cx="5" cy="73" r="3" fill="#10B981"/>
    <text x="15" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#10B981" font-weight="500">ONLINE</text>
    
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#71717A">Eritheia Labs</text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#525252"> Lahore, Pakistan</text>
  </g>

</svg>
