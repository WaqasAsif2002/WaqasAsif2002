<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="grain"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad-warm" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep black canvas -->
  <rect width="100%" height="100%" fill="#000000"/>

  <!-- Ambient volumetric light — feels like soft stage lighting -->
  <g filter="url(#glow)">
    <ellipse cx="280" cy="190" rx="220" ry="180" fill="url(#grad-accent)"/>
    <ellipse cx="600" cy="160" rx="160" ry="140" fill="url(#grad-warm)"/>
  </g>

  <!-- Subtle film grain overlay for texture -->
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.4"/>

  <!-- Thin structural lines — architectural precision -->
  <line x1="70" y1="0" x2="70" y2="380" stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5"/>
  <line x1="770" y1="0" x2="770" y2="380" stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5"/>
  <line x1="0" y1="65" x2="840" y2="65" stroke="#ffffff" stroke-opacity="0.025" stroke-width="0.5"/>

  <!-- Top-left metadata — the details that signal craft -->
  <text x="70" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#525252" letter-spacing="3" font-weight="500">PORTFOLIO // 2026</text>
  <text x="625" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#525252" letter-spacing="3" font-weight="500">LAHORE, PAKISTAN</text>

  <!-- Primary Name — massive, cinematic, considered -->
  <text x="70" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" fill="url(#text-gradient)" font-weight="800" letter-spacing="-3">Abdullah</text>
  <text x="70" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" fill="url(#text-gradient)" font-weight="800" letter-spacing="-3">Bin Ata</text>

  <!-- Accent line — a single confident stroke -->
  <line x1="70" y1="258" x2="270" y2="258" stroke="url(#line-grad)" stroke-width="2"/>

  <!-- Role descriptor — understated, precise -->
  <text x="72" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#A1A1AA" letter-spacing="4" font-weight="500">FULL STACK ARCHITECT</text>

  <text x="72" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#525252" letter-spacing="1" font-weight="400">Building next-generation digital ecosystems with the MERN stack.</text>
  <text x="72" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#525252" letter-spacing="1" font-weight="400">Engineering at Eritheia Labs. Obsessed with craft.</text>

  <!-- Right-side vertical accent marker -->
  <rect x="760" y="140" width="3" height="80" rx="1.5" fill="#7C3AED" opacity="0.5"/>

  <!-- Bottom edge fade line -->
  <line x1="0" y1="370" x2="840" y2="370" stroke="url(#line-grad)" stroke-width="0.5"/>
</svg>
